<title>Starbreaker Saga</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  Starbreaker Saga — a turn-based space-knight RPG in the style of the Flash series
  "Lethal RPG Universe". Original names, story and art. See ROADMAP.md for the session plan.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: a single centred console, HUD strip on top, one screen at a time below. Deliberately dark-only (space cockpit). */
:root {
  --void: #070508;
  --well: #0a0709;
  --hull: #141015;
  --hull-2: #221a20;
  --line: #4a1c26;
  --text: #f1ecef;
  --dim: #b49ea6;
  --gold: #e5394a;
  --gold-ink: #ffffff;
  --hp: #ef5d6b;
  --en: #5ad1e6;
  --xp: #b88cff;
  --good: #6fdc8c;
  --display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: radial-gradient(1200px 600px at 50% -10%, #3a0a14 0%, var(--void) 60%) fixed, var(--void);
  color: var(--text);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 32px;
}
button { font: inherit; color: inherit; }
.app { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: 0.02em; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
.dim { color: var(--dim); }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }
.label { font-family: var(--display); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--dim); }

/* HUD */
.hud { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 14px; align-items: center;
  background: var(--hull); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.hud .who { font-family: var(--display); font-weight: 700; font-size: 1.05rem; }
.hud .who small { color: var(--gold); font-weight: 600; margin-left: 6px; }
.bars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; min-width: 0; }
.bar { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.bar .track { height: 8px; background: var(--well); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 4px; transition: width .35s ease; }
.bar .meta { display: flex; justify-content: space-between; font-size: 0.72rem; gap: 6px; }
.credits { font-family: var(--display); color: var(--gold); font-weight: 600; white-space: nowrap; }
@media (max-width: 560px) {
  .hud { grid-template-columns: 1fr auto; }
  .bars { grid-column: 1 / -1; grid-row: 2; }
}

/* Panels and buttons */
.panel { background: var(--hull); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.btn { background: var(--hull-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px;
  font-family: var(--display); font-weight: 600; letter-spacing: 0.03em; cursor: pointer; text-align: left;
  transition: border-color .15s, background .15s, transform .08s; }
.btn:hover:not(:disabled) { border-color: var(--gold); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.btn.small { padding: 6px 10px; font-size: 0.85rem; }
.btn .sub { display: block; font-family: var(--body); font-weight: 500; font-size: 0.78rem; color: var(--dim); letter-spacing: 0; }
.btn.primary .sub { color: #ffd6da; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-family: var(--display); font-size: 0.85rem; }
.tab[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
  padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #100c10; }
.item .name { font-family: var(--display); font-weight: 600; }
.item .desc { font-size: 0.85rem; color: var(--dim); }
.tag { font-family: var(--display); font-size: 0.7rem; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
.tag.on { border-color: var(--good); color: var(--good); }

/* Title */
.title-card { text-align: center; align-items: center; padding: 40px 20px; gap: 18px; overflow: hidden; position: relative; }
.title-card h1 { font-size: clamp(2.2rem, 8vw, 3.6rem); line-height: 1; text-transform: uppercase; letter-spacing: 0.06em; }
.title-card h1 span { color: var(--gold); display: block; font-size: 0.42em; letter-spacing: 0.5em; margin-top: 10px; }
.title-card p { max-width: 52ch; color: var(--dim); }
#titleCanvas { width: 100%; height: auto; aspect-ratio: 2 / 1; border-radius: 8px; border: 1px solid var(--line); }
.title-card { padding: 16px; }

/* Map */
.worlds { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.world { position: relative; display: flex; gap: 12px; align-items: center; padding: 12px; }
.globe { width: 54px; height: 54px; border-radius: 50%; flex: none; box-shadow: inset -10px -8px 16px rgba(0,0,0,.55), 0 0 18px var(--glow, transparent); }
.world.locked .globe { filter: grayscale(1) brightness(.5); }
.world .info { min-width: 0; }

/* Hub */
.hub-head { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 14px; align-items: center; }
.progress { height: 6px; background: var(--well); border-radius: 3px; overflow: hidden; }
.progress > div { height: 100%; background: var(--gold); }

/* Battle */
.combatants { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.cbox { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cbox .nm { font-family: var(--display); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fxrow { display: flex; gap: 4px; flex-wrap: wrap; min-height: 20px; }
.fx { font-family: var(--display); font-size: 0.68rem; padding: 1px 6px; border-radius: 4px; background: var(--well); border: 1px solid var(--line); }
#battleCanvas { width: 100%; height: auto; aspect-ratio: 9 / 4; display: block; border-radius: 8px; background: #000; }
.log { font-size: 0.88rem; min-height: 5.6em; display: flex; flex-direction: column; gap: 2px; }
.log div:not(:last-child) { color: var(--dim); }
.log b { color: var(--gold); font-weight: 600; }
.actions { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .actions { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.actions .btn { text-align: center; }

/* Story */
.story { max-width: 60ch; margin: 0 auto; gap: 16px; }
.story p { font-size: 1.02rem; line-height: 1.6; }
.story .who { font-family: var(--display); color: var(--gold); text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.78rem; }

/* Stats */
.stat { display: grid; grid-template-columns: 4.5em minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.stat .k { font-family: var(--display); font-weight: 700; }
textarea { width: 100%; min-height: 80px; background: var(--well); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-family: ui-monospace, monospace; font-size: 0.75rem; resize: vertical; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--gold); color: var(--gold-ink);
  font-family: var(--display); font-weight: 600; padding: 8px 16px; border-radius: 8px; z-index: 20; max-width: calc(100% - 32px); }
/* Appearance */
.creator { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 18px; align-items: start; }
.preview { display: flex; flex-direction: column; gap: 10px; align-items: center; }
#createCanvas { width: 100%; max-width: 240px; height: auto; aspect-ratio: 4 / 5; border-radius: 10px; border: 1px solid var(--line); display: block; }
.portrait-big { width: 150px; height: 150px; border-radius: 10px; border: 1px solid var(--line); }
.cyc { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 10px; align-items: center; }
.cyc-ctl { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; align-items: center; max-width: 320px; }
.cyc-val { display: flex; align-items: center; gap: 8px; justify-content: center; font-family: var(--display); font-weight: 600; background: var(--well); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cyc-val small { color: var(--dim); font-weight: 500; font-size: 0.72rem; }
.chip { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line); flex: none; }
.btn.arrow { padding: 6px 10px; font-size: 0.8rem; }
.outfit { margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
@media (max-width: 460px) { .cyc { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
.menu-col { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 240px; }
.menu-col .btn { text-align: center; }
.hud-end { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
.hub-hero { background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 0; cursor: pointer; }
.hub-hero:hover { border-color: var(--gold); }
.hub-hero:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#hubHero { width: 96px; height: 120px; display: block; }
.opts { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.opt { display: flex; flex-direction: column; gap: 6px; }
.opt .note { font-size: 0.8rem; }
.tab:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
input#heroName { background: var(--well); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; font-family: var(--display); max-width: 280px; }
input#heroName:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.hud .who { display: flex; align-items: center; gap: 10px; }
.portrait { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); flex: none; }
@media (max-width: 600px) { .creator { grid-template-columns: minmax(0, 1fr); } .preview { flex-direction: row; justify-content: center; } #createCanvas { max-width: 180px; } .portrait-big { width: 110px; height: 110px; } }
/* Cutscenes, story and hall */
.cs { gap: 10px; }
#csCanvas, #hallCanvas { width: 100%; height: auto; aspect-ratio: 9 / 4; display: block; border-radius: 8px; background: #000; }
#csCanvas { cursor: pointer; }
.cs-box { background: #0a0709; border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; min-height: 6.2em; display: flex; gap: 14px; align-items: flex-start; }
.cs-words { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cs-portrait { width: 160px; height: 181px; flex: none; border-radius: 8px; border: 1px solid var(--line); }
@media (max-width: 520px) { .cs-portrait { width: 84px; height: 95px; } }
.cs-who { font-family: var(--display); font-weight: 700; color: var(--gold); letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.82rem; }
.cs-text { font-size: 1.04rem; line-height: 1.55; max-width: 68ch; }
.cs-box.narration .cs-text { font-style: italic; color: #d8d4f4; }
.cs-actions { align-items: center; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.fx.weak { color: #ffd27a; border-color: #8a6a2a; }
.fx.res { color: var(--dim); }
.warn { background: #2a0a10; border: 1px solid var(--gold); border-radius: 8px; padding: 8px 12px; color: #ffd0d4; animation: warnpulse 1s ease-in-out infinite alternate; }
@keyframes warnpulse { from { box-shadow: 0 0 0 rgba(229,57,74,0); } to { box-shadow: 0 0 14px rgba(229,57,74,0.55); } }
@media (prefers-reduced-motion: reduce) { .warn { animation: none; } }
.keeper { display: flex; gap: 14px; align-items: flex-start; background: #0a0709; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.keeper-words { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
.keeper-words p { margin: 0; line-height: 1.5; }
.sector { width: 100%; height: auto; aspect-ratio: 720 / 200; border-radius: 10px; border: 1px solid var(--line); display: block; }
.hollow .fill { background: linear-gradient(90deg, #a04aff, #ff9a4a) !important; }
.hall-title { font-family: var(--display); font-size: 1.5rem; font-weight: 700; color: var(--gold); text-align: center; letter-spacing: 0.04em; }
.talk { background: var(--well); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; min-height: 4.4em; }
.talk b { font-family: var(--display); color: var(--gold); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.06em; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/story.js"></script>
<script src="js/portrait.js"></script>
<script src="js/cutscene.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
